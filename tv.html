    var n = -1, start = Date.now();
    function weiter() {
      if (n >= 0) { els[n].classList.remove("an"); var vo = els[n].querySelector("video"); if (vo) { vo.pause(); } }
      n = (n + 1) % folien.length;
      els[n].classList.add("an");
      var f = folien[n];
      if (n === 0 && Date.now() - start > NEUSTART_MIN * 60000) { location.reload(); return; }
      if (f.video) {
        var v = els[n].querySelector("video"), fertig = false;
        function ende() { if (!fertig) { fertig = true; weiter(); } }
        try { v.currentTime = 0; var p = v.play(); if (p && p.catch) { p.catch(function () { setTimeout(ende, 6000); }); } } catch (e) { setTimeout(ende, 6000); }
        v.onended = ende; setTimeout(ende, 30000);
      } else { setTimeout(weiter, f.dauer * 1000); }
    }
    weiter();
  });
})();
</script>
